<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revista FIMIM</title>
<meta name="description" content="Revista online a Facultății de Inginerie Mecanică, Industrială și Maritimă, Universitatea Ovidius din Constanța.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  body { background: var(--fundal-2); }
  .antet { background: #fff; border-bottom: 1px solid var(--linie); }
  .antet .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 18px; padding-bottom: 18px; flex-wrap: wrap; }
  .antet .inst { font-size: 13px; color: var(--text-2); }
  .antet .inst strong { display: block; color: var(--text); font-size: 14px; }
  .antet .stare { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-2); border: 1px solid var(--linie); padding: 4px 10px; border-radius: 99px; background: var(--fundal-2); }


  .pas { padding: 24px 0 8px; }
  main > .pas:first-child { padding-top: 48px; }
  .pas-cap { display: flex; align-items: baseline; gap: 14px; margin-bottom: 18px; }
  .pas-cap .nr { font: 600 13px/1 "Inter", sans-serif; color: #fff; background: var(--text); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; transform: translateY(-3px); }
  .pas-cap h2 { font-size: 22px; margin: 0; }
  .pas-cap p { margin: 0; color: var(--text-2); font-size: 14px; }

  .grila-nume { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card-nume {
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: #fff; border: 2px solid transparent; border-radius: 10px; padding: 0; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--linie);
    transition: box-shadow .15s, transform .15s, border-color .15s;
    display: flex; flex-direction: column;
  }
  .card-nume:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08), 0 0 0 1px var(--linie); }
  .card-nume:focus-visible { outline: 3px solid #4b8bf5; outline-offset: 2px; }
  .card-nume[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 8px 24px rgba(0,0,0,.1); }
  .card-nume .mast { background: var(--c); color: #fff; padding: 22px 20px 18px; position: relative; }
  .card-nume .mast::after { content: ""; position: absolute; left: 20px; bottom: 0; width: 48px; height: 4px; background: var(--a); }
  .card-nume .mast small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; opacity: .75; margin-bottom: 8px; }
  .card-nume .mast strong { font-family: "Source Serif 4", Georgia, serif; font-size: 25px; font-weight: 600; line-height: 1.15; display: block; }
  .card-nume .corp { padding: 16px 20px 20px; font-size: 14px; color: var(--text-2); flex: 1; }
  .card-nume .corp em { display: block; font-style: normal; color: var(--text); font-weight: 500; margin-bottom: 6px; }
  .card-nume .bifa { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6); display: grid; place-items: center; font-size: 14px; }
  .card-nume[aria-pressed="true"] .bifa { background: #fff; color: var(--c); border-color: #fff; }

  .grila-format { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card-format {
    display: flex; flex-direction: column; text-decoration: none; background: #fff; border-radius: 10px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--linie); transition: box-shadow .15s, transform .15s;
  }
  .card-format:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0,0,0,.1), 0 0 0 1px var(--linie); }
  .card-format:focus-visible { outline: 3px solid #4b8bf5; outline-offset: 2px; }
  .schita { background: var(--fundal-2); padding: 18px; border-bottom: 1px solid var(--linie); aspect-ratio: 16/10; }
  .schita svg { width: 100%; height: 100%; }
  .card-format .corp { padding: 18px 20px 22px; display: flex; flex-direction: column; flex: 1; }
  .card-format .nr { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--text-2); }
  .card-format h3 { font-size: 20px; margin: 4px 0 2px; }
  .card-format .insp { font-size: 13px; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
  .card-format p { font-size: 14px; color: var(--text-2); flex: 1; }
  .card-format .deschide { font-weight: 600; font-size: 14px; color: var(--brand); }

  footer { border-top: 1px solid var(--linie); background: #fff; font-size: 13px; color: var(--text-2); padding: 20px 0; }
</style>
</head>
<body>

<header class="antet">
  <div class="container">
    <div class="inst">
      <strong data-universitate></strong>
      <span data-facultate></span>
    </div>
  </div>
</header>

<main class="container" style="padding-bottom:56px">

  <section class="pas" aria-labelledby="pas1">
    <div class="pas-cap"><span class="nr">1</span><div><h2 id="pas1">Denumirea revistei</h2><p>Selecția se păstrează în toate formatele și poate fi schimbată oricând din bara de sus.</p></div></div>
    <div class="grila-nume" id="grila-nume"></div>
  </section>

  <section class="pas" aria-labelledby="pas2">
    <div class="pas-cap"><span class="nr">2</span><div><h2 id="pas2">Format</h2><p>Deschideți pe rând fiecare format. Puteți trece de la unul la altul din bara de sus a paginii.</p></div></div>
    <div class="grila-format" id="grila-format"></div>
  </section>
</main>

<footer><div class="container">&copy; <span data-an></span> <span data-facultate></span> · <span data-universitate></span></div></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function () {
  var A = window.APP, R = A.R, ales = A.id;

  var schite = {
    campus: '<svg viewBox="0 0 320 200"><rect width="320" height="200" fill="#fff"/><rect x="0" y="0" width="320" height="26" fill="C1"/><rect x="12" y="9" width="70" height="8" fill="#fff"/><rect x="12" y="38" width="190" height="96" fill="C1" opacity=".8"/><rect x="12" y="142" width="170" height="8" fill="#222"/><rect x="12" y="156" width="130" height="6" fill="#bbb"/><rect x="214" y="38" width="94" height="6" fill="C2"/><rect x="214" y="50" width="94" height="6" fill="#222"/><rect x="214" y="60" width="70" height="5" fill="#bbb"/><line x1="214" y1="74" x2="308" y2="74" stroke="#ddd"/><rect x="214" y="82" width="94" height="6" fill="#222"/><rect x="214" y="92" width="80" height="5" fill="#bbb"/><line x1="214" y1="106" x2="308" y2="106" stroke="#ddd"/><rect x="214" y="114" width="94" height="6" fill="#222"/><rect x="214" y="124" width="60" height="5" fill="#bbb"/><rect x="12" y="172" width="90" height="20" fill="#eee"/><rect x="115" y="172" width="90" height="20" fill="#eee"/><rect x="218" y="172" width="90" height="20" fill="#eee"/></svg>',
    magazin: '<svg viewBox="0 0 320 200"><rect width="320" height="200" fill="#fff"/><rect x="0" y="0" width="320" height="120" fill="C1"/><rect x="0" y="0" width="320" height="120" fill="C2" opacity=".35"/><rect x="24" y="66" width="150" height="14" fill="#fff"/><rect x="24" y="86" width="100" height="7" fill="#fff" opacity=".8"/><rect x="140" y="10" width="40" height="6" fill="#fff"/><rect x="24" y="132" width="84" height="44" fill="C1" opacity=".6"/><rect x="118" y="132" width="84" height="44" fill="C2" opacity=".6"/><rect x="212" y="132" width="84" height="44" fill="C1" opacity=".4"/><rect x="24" y="182" width="70" height="6" fill="#222"/><rect x="118" y="182" width="70" height="6" fill="#222"/><rect x="212" y="182" width="70" height="6" fill="#222"/></svg>',
    tipografic: '<svg viewBox="0 0 320 200"><rect width="320" height="200" fill="#fff"/><rect x="12" y="10" width="90" height="4" fill="#999"/><rect x="230" y="10" width="78" height="4" fill="#999"/><line x1="12" y1="18" x2="308" y2="18" stroke="C1"/><rect x="100" y="28" width="120" height="12" fill="C1"/><rect x="12" y="52" width="150" height="90" fill="C1" opacity=".8"/><rect x="172" y="56" width="136" height="9" fill="C1"/><rect x="172" y="72" width="130" height="4" fill="#666"/><rect x="172" y="80" width="120" height="4" fill="#666"/><rect x="172" y="96" width="136" height="40" rx="2" fill="#f2f5f7" stroke="C1"/><line x1="12" y1="154" x2="308" y2="154" stroke="#222" stroke-width="1.5"/><line x1="12" y1="162" x2="308" y2="162" stroke="#222" stroke-width=".6"/><rect x="12" y="168" width="200" height="4" fill="#999"/><rect x="12" y="176" width="170" height="4" fill="#999"/><line x1="12" y1="186" x2="308" y2="186" stroke="#222" stroke-width="1.5"/></svg>',
    academic: '<svg viewBox="0 0 320 200"><rect width="320" height="200" fill="#fff"/><rect x="0" y="0" width="320" height="34" fill="#fff"/><rect x="12" y="10" width="110" height="10" fill="C1"/><rect x="12" y="24" width="70" height="4" fill="#999"/><rect x="0" y="34" width="320" height="14" fill="C1"/><rect x="12" y="58" width="72" height="96" fill="C1" opacity=".85"/><rect x="20" y="70" width="50" height="5" fill="#fff"/><rect x="96" y="58" width="150" height="7" fill="#222"/><rect x="96" y="70" width="110" height="5" fill="#999"/><rect x="96" y="78" width="60" height="5" fill="C2"/><line x1="96" y1="90" x2="250" y2="90" stroke="#ddd"/><rect x="96" y="98" width="150" height="7" fill="#222"/><rect x="96" y="110" width="110" height="5" fill="#999"/><rect x="96" y="118" width="60" height="5" fill="C2"/><line x1="96" y1="130" x2="250" y2="130" stroke="#ddd"/><rect x="258" y="58" width="50" height="96" fill="#f1f1f1"/><rect x="0" y="166" width="320" height="34" fill="#f4f4f4"/><rect x="12" y="176" width="60" height="6" fill="C2"/><rect x="12" y="186" width="200" height="4" fill="#bbb"/></svg>'
  };

  function deseneazaNume() {
    var g = document.getElementById("grila-nume");
    g.innerHTML = Object.keys(R.denumiri).map(function (k) {
      var d = R.denumiri[k];
      return '<button type="button" class="card-nume" data-id="' + k + '" aria-pressed="' + (k === ales) + '" style="--c:' + d.culoare + ';--a:' + d.accent + '">' +
        '<div class="mast"><small>Revista FIMIM</small><strong>' + A.esc(d.titlu) + '</strong><span class="bifa" aria-hidden="true">' + (k === ales ? "&#10003;" : "") + "</span></div>" +
        '<div class="corp"><em>' + A.esc(d.motto) + "</em>" + A.esc(d.descriere) + "</div></button>";
    }).join("");
    g.querySelectorAll(".card-nume").forEach(function (b) {
      b.addEventListener("click", function () {
        ales = b.dataset.id;
        A.salveaza(ales);
        history.replaceState(null, "", "?n=" + ales);
        var d = R.denumiri[ales];
        document.documentElement.style.setProperty("--brand", d.culoare);
        document.documentElement.style.setProperty("--accent", d.accent);
        deseneazaNume();
        deseneazaFormate();
        var bt = document.querySelector('.card-nume[data-id="' + ales + '"]');
        if (bt) bt.focus();
      });
    });
  }

  function deseneazaFormate() {
    var d = R.denumiri[ales];
    var g = document.getElementById("grila-format");
    g.innerHTML = R.formate.map(function (f) {
      var s = schite[f.id].replace(/C1/g, d.culoare).replace(/C2/g, d.accent);
      return '<a class="card-format" href="' + f.fisier + "?n=" + ales + '">' +
        '<div class="schita" aria-hidden="true">' + s + "</div>" +
        '<div class="corp"><span class="nr">Formatul ' + f.nr + "</span><h3>" + A.esc(f.nume) + "</h3><p>" + A.esc(f.descriere) + '</p><span class="deschide">Deschide formatul cu „' + A.esc(d.titlu) + "” &rarr;</span></div></a>";
    }).join("");
  }

  A.completeaza();
  document.title = "Revista FIMIM";
  deseneazaNume();
  deseneazaFormate();
})();
</script>
</body>
</html>
