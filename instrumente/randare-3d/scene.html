function shell(geo, mat = glass, edges = true, thr = 20) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(geo, mat));
  if (edges) g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, thr), edgeMat));
  return g;
}
function wire(geo, mat = edgeSoft) { return new THREE.LineSegments(new THREE.WireframeGeometry(geo), mat); }
const root = new THREE.Group(); scene.add(root);

function gearShape(r, teeth, depth, holeR) {
  const s = new THREE.Shape();
  const n = teeth * 4;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const k = i % 4;
    const rr = (k === 1 || k === 2) ? r + depth : r;
    const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
    i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  if (holeR) { const h = new THREE.Path(); h.absarc(0, 0, holeR, 0, Math.PI * 2, true); s.holes.push(h); }
  const spokes = 5, sr1 = holeR * 1.8, sr2 = r * 0.72;
  for (let i = 0; i < spokes; i++) {
    const a0 = (i / spokes) * Math.PI * 2 + 0.22, a1 = ((i + 1) / spokes) * Math.PI * 2 - 0.22;
    const p = new THREE.Path();
    p.absarc(0, 0, sr2, a0, a1, false);
    p.lineTo(Math.cos(a1) * sr1, Math.sin(a1) * sr1);
    p.absarc(0, 0, sr1, a1, a0, true);
    s.holes.push(p);
  }
  return s;
}
function gear(r, teeth, th = 0.35, depth = 0.18) {
  const geo = new THREE.ExtrudeGeometry(gearShape(r, teeth, depth, r * 0.16), { depth: th, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 1, curveSegments: 24 });
  geo.translate(0, 0, -th / 2);
  return shell(geo, glassTint, true, 25);
}
function wheel(R = 0.42, w = 0.28) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(R - 0.09, 0.1, 18, 48), rubber);
  tire.scale.z = w / 0.2;
  g.add(tire);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.TorusGeometry(R - 0.09, 0.1, 6, 32), 30), edgeSoft));
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.17, R - 0.17, w * 0.7, 32, 1, true), metal); rim.rotation.x = Math.PI / 2; g.add(rim);
  for (let i = 0; i < 5; i++) {
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.05, R - 0.2, 0.04), metal);
    sp.position.set(0, (R - 0.2) / 2, w * 0.3); const pv = new THREE.Group(); pv.add(sp); pv.rotation.z = (i / 5) * Math.PI * 2; g.add(pv);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, w * 0.8, 20), metal); hub.rotation.x = Math.PI / 2; g.add(hub);
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(R - 0.2, R - 0.2, 0.03, 32), darkMetal); disc.rotation.x = Math.PI / 2; disc.position.z = -w * 0.15; g.add(disc);
  const cal = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.2, 0.08), accent); cal.position.set(R - 0.27, 0.05, -w * 0.15); g.add(cal);
  return g;
}

  lattice() {
    // rețea cristalină (material) cu atomi și legături, într-un cub de sticlă
    const n = 4, d = 0.75, off = (n - 1) * d / 2;
    const atomA = new THREE.MeshPhysicalMaterial({ color: 0xdffcf0, metalness: 0.3, roughness: 0.15, transmission: 0, clearcoat: 1 });

      if (i < n - 1) bond(p, p.clone().add(new THREE.Vector3(d, 0, 0)));
      if (j < n - 1) bond(p, p.clone().add(new THREE.Vector3(0, d, 0)));
      if (k < n - 1) bond(p, p.clone().add(new THREE.Vector3(0, 0, d)));
      if (i < n - 1 && j < n - 1 && k < n - 1) { const c = new THREE.Mesh(geoB, copper); c.position.copy(p).addScalar(d / 2); root.add(c); }
    }
    const box = new THREE.BoxGeometry(n * d + 0.2, n * d + 0.2, n * d + 0.2); root.add(shell(box, glass, true));
    root.rotation.set(0.45, 0.65, 0);
    return { cam: [0, 0.3, 7.2], target: [0, 0, 0], fov: 38 };
  },

  engine() {
    // secțiune motor: cilindru transparent, piston, bielă, arbore cotit
    const cyl = new THREE.CylinderGeometry(0.62, 0.62, 2.0, 40, 1, true); const C = shell(cyl, glass, true); C.position.y = 1.6; root.add(C);
    root.add(wire(new THREE.CylinderGeometry(0.62, 0.62, 2.0, 20, 4, true)).translateY(1.6));
    const head = new THREE.BoxGeometry(1.6, 0.4, 1.6); const Hd = shell(head, glassTint, true); Hd.position.y = 2.8; root.add(Hd);
    const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.58, 0.6, 40), metal); piston.position.y = 1.55; root.add(piston);
    for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.585, 0.018, 8, 40), copper); r.rotation.x = Math.PI / 2; r.position.y = 1.72 - i * 0.09; root.add(r); }
    const rod = new THREE.Mesh(new THREE.BoxGeometry(0.16, 1.5, 0.12), darkMetal); rod.position.set(0.12, 0.72, 0); rod.rotation.z = -0.16; root.add(rod);
    const crankGrp = new THREE.Group(); crankGrp.position.y = 0; root.add(crankGrp);
    const sh = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.6, 20), metal); sh.rotation.x = Math.PI / 2; crankGrp.add(sh);
    [-0.22, 0.22].forEach(z => { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.12, 32, 1, false, -0.9, 3.9), darkMetal); w.rotation.x = Math.PI / 2; w.position.z = z; crankGrp.add(w); });
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.5, 16), accent); pin.rotation.x = Math.PI / 2; pin.position.set(0.25, 0.0, 0); crankGrp.add(pin);
    [-0.35, 0.35].forEach(x => { const v = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.55, 10), metal); v.position.set(x, 3.15, 0); root.add(v); const vh = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.03, 0.06, 20), metal); vh.position.set(x, 2.88, 0); root.add(vh); });
    const spark = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.45, 12), accent); spark.position.set(0, 3.15, 0); root.add(spark);
    const sump = new THREE.BoxGeometry(1.8, 1.1, 1.4); const S = shell(sump, glass, true); S.position.y = -0.1; root.add(S);
    return { cam: [4.8, 2.8, 5.4], target: [0, 1.35, 0], fov: 40 };
  },

  caliper() {
    // șubler (instrument de măsură) și o piesă prelucrată
    const beam = new THREE.BoxGeometry(5.0, 0.32, 0.06); root.add(shell(beam, glassTint, true));
    for (let i = 0; i <= 40; i++) { const t = new THREE.Mesh(new THREE.BoxGeometry(0.012, i % 5 ? 0.06 : 0.11, 0.01), darkMetal); t.position.set(-2.3 + i * 0.11, 0.16 - (i % 5 ? 0.03 : 0.055), 0.036); root.add(t); }
    const fj = new THREE.Shape(); fj.moveTo(0, 0); fj.lineTo(0.35, 0); fj.lineTo(0.35, -1.0); fj.lineTo(0.12, -1.25); fj.lineTo(0, -1.25); fj.lineTo(0, 0);
    const fg = new THREE.ExtrudeGeometry(fj, { depth: 0.06, bevelEnabled: false }); fg.translate(-2.5, -0.16, -0.03); root.add(shell(fg, glass, true));
    const sl = new THREE.Group(); sl.position.x = -0.6; root.add(sl);
    const slb = new THREE.BoxGeometry(1.1, 0.5, 0.14); sl.add(shell(slb, glass, true));
    const mj = new THREE.Shape(); mj.moveTo(0, 0); mj.lineTo(-0.35, 0); mj.lineTo(-0.35, -1.0); mj.lineTo(-0.12, -1.25); mj.lineTo(0, -1.25); mj.lineTo(0, 0);
    const mg = new THREE.ExtrudeGeometry(mj, { depth: 0.06, bevelEnabled: false }); mg.translate(-0.2, -0.25, -0.03); sl.add(shell(mg, glass, true));
    const lcd = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.22, 0.02), accent); lcd.position.set(0.15, 0.05, 0.08); sl.add(lcd);
    // piesă: bucșă cilindrică între fălci
    const bush = new THREE.CylinderGeometry(0.62, 0.62, 0.9, 48, 1, true); const B = shell(bush, metal, false); B.position.set(-1.43, -0.95, 0); B.rotation.x = Math.PI / 2; root.add(B);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.92, 40, 1, true), darkMetal); inner.position.copy(B.position); inner.rotation.x = Math.PI / 2; root.add(inner);
    const ring = new THREE.RingGeometry(0.35, 0.62, 48); [0.45, -0.45].forEach(z => { const r = new THREE.Mesh(ring, metal); r.position.set(-1.43, -0.95, z); if (z < 0) r.rotation.y = Math.PI; root.add(r); });
    // schiță tehnică (plan transparent)
    const plan = new THREE.PlaneGeometry(4.4, 2.8, 8, 5); const pl = shell(plan, glass, true); pl.position.set(0.6, -0.5, -1.2); pl.rotation.y = -0.1; root.add(pl);
    root.rotation.set(0.3, -0.5, 0.05);
    return { cam: [0, 0.2, 7.0], target: [-0.3, -0.45, 0], fov: 40 };
  },

  bulb() {
    // bec (idee) cu filament și dulie, sticlă reală
    const pts = [];
    for (let i = 0; i <= 40; i++) { const t = i / 40; const a = -Math.PI / 2 + t * Math.PI * 1.25; pts.push(new THREE.Vector2(Math.max(0.001, Math.cos(a) * 1.1), Math.sin(a) * 1.1 + 1.6)); }
    pts.push(new THREE.Vector2(0.48, 0.55), new THREE.Vector2(0.45, 0.2));
    pts.sort((a, b) => a.y - b.y);
    const g = new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p.x, p.y)), 64);
    root.add(shell(g, glass, false));
    root.add(wire(new THREE.LatheGeometry(pts, 16), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18 })));
    for (let i = 0; i < 6; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.04, 10, 40), metal); r.rotation.x = Math.PI / 2; r.position.y = 0.15 - i * 0.12; root.add(r); }
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.3, 0.75, 40), darkMetal); cap.position.y = -0.18; root.add(cap);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 12), copper); tip.position.y = -0.6; root.add(tip);
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.18, 0.9, 20), glassTint); stem.position.y = 0.7; root.add(stem);
    [-0.18, 0.18].forEach(x => { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 1.0, 6), metal); w.position.set(x, 1.15, 0); root.add(w); });
    const coil = []; for (let i = 0; i <= 200; i++) { const t = i / 200; coil.push(new THREE.Vector3(-0.18 + t * 0.36, 1.65 + Math.sin(t * Math.PI) * 0.18 + Math.cos(t * 60) * 0.03, Math.sin(t * 60) * 0.03)); }
    root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(coil), 300, 0.012, 6), new THREE.MeshBasicMaterial({ color: 0xffe9a8 })));
    const glow = new THREE.PointLight(0xfff0c0, 6, 4); glow.position.set(0, 1.7, 0); scene.add(glow);
    // roată dințată mică lângă bec
    const gg = gear(0.55, 10, 0.18, 0.1); gg.position.set(1.35, 0.25, -0.3); gg.rotation.set(0.3, -0.6, 0); root.add(gg);
    return { cam: [2.8, 1.7, 5.8], target: [0.25, 1.15, 0], fov: 40 };
  }
};

const cfg = builders[model]();
const cam = new THREE.PerspectiveCamera(cfg.fov, W / H, 0.1, 100);
cam.position.set(...cfg.cam); cam.lookAt(new THREE.Vector3(...cfg.target));
// umbră moale de contact
renderer.render(scene, cam);
window.__done = true;
</script>
